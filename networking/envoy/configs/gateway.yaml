apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: public-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: {{ index .Cluster.metadata.labels "gatewayclass" }}
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    hostname: '*.{{ index .Cluster.metadata.labels "internaldomainname" }}'
    name: http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    hostname: '*.{{ index .Cluster.metadata.labels "internaldomainname" }}'
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: wildcard-{{ index .Cluster.metadata.labels "internaldomainname" }}
      mode: Terminate
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
  labels:
    app: kube-prometheus-stack-prometheus
    app.kubernetes.io/instance: kps
    ps: yes
  name: kps-grafana
  namespace: monitoring
spec:
  hostnames:
  - grafana.{{ index .Cluster.metadata.labels "internaldomainname" }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gateway
    namespace: envoy-gateway-system
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: kps-grafana
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
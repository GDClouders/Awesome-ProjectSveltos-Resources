  apiVersion: config.projectsveltos.io/v1beta1
  kind: ClusterProfile
  metadata:
    name: deploy-external-secret-operator
  spec:
    clusterSelector:
      matchLabels:
        external-secret-operator: enabled
    syncMode: ContinuousWithDriftDetection
    helmCharts:
      - repositoryURL:    https://charts.external-secrets.io
        repositoryName:   external-secrets
        chartName:        external-secrets/external-secret-operator
        chartVersion:     v2.13.0
        releaseName:      external-secret-operator
        releaseNamespace: '{{ index .Cluster.metadata.labels "cluster.x-k8s.io/cluster-name" }}-external-secret-operator'
        helmChartAction:  Install
    
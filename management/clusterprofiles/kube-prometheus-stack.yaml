apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: kube-prometheus-stack
spec:
  clusterSelector:
    matchLabels:
      kube-prometheus-stack: enabled
  syncMode: 
  policyRefs:
  - kind: GitRepository
    name: awesome-projectsveltos-resources
    namespace: flux2
    path: ./monitoring/kube-prometheus-stack/configs
  helmCharts:
    - repositoryURL: https://prometheus-community.github.io/helm-charts
      repositoryName: prometheus-community
      chartName: prometheus-community/kube-prometheus-stack
      chartVersion: 92.11.0
      releaseName: kps
      releaseNamespace: monitoring
      helmChartAction: Install
      values: |
        crds:
          enabled: true
          upgradeJob:
            enabled: true
            forceConflicts: true
        grafana:
          enabled: true
          adminPassword: admin
          service:
            type: ClusterIP
            portName: http-web
          persistence:
            storageClassName: '{{ .Cluster.metadata.labels.storageclass }}'
            accessModes:
              - ReadWriteOnce
            enabled: true
            size: 10Gi
        prometheus:
          route:
            main:
              hostnames: 
                - "prometheus.{{ .Cluster.metadata.labels.internaldomainname }}"
              enabled: true
              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  name: public-gateway
                  namespace: envoy-gateway-system
          prometheusSpec:
            retention: 10d
            retentionSize: "40GiB"
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: "{{ .Cluster.metadata.labels.storageclass }}"
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi
        alertmanager:
          enabled: true
          route:
            main:
              hostnames: 
                - "alertmanager.{{ .Cluster.metadata.labels.internaldomainname }}"
              enabled: true
              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  name: public-gateway
                  namespace: envoy-gateway-system
          alertmanagerSpec:
            retention: 100h
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: "{{ .Cluster.metadata.labels.storageclass }}"
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi
        kube-state-metrics:
          enabled: true
        nodeExporter:
          enabled: true
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: true
        kubeScheduler:
          enabled: true
